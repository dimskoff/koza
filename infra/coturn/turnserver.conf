# koza turn relay (coturn)
#
# Fallback path when two browsers can't connect directly through their NATs.
# The shared secret and realm are passed by docker compose from the
# environment (KOZA_TURN_SECRET / KOZA_HOST) — never commit them here.
#
# Firewall: open 3478/udp, 3478/tcp and 49160-49200/udp.
# Note: coturn does not support inline comments — keep them on own lines.

listening-port=3478

# time-limited HMAC credentials issued by the api (/api/v1/turn)
use-auth-secret

# relay port range
min-port=49160
max-port=49200

fingerprint
stale-nonce
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers

# max concurrent allocations per user
user-quota=12
total-quota=1200

# Never relay into private / local networks (prevents using TURN as a
# proxy into the server's LAN or cloud metadata endpoints).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log

# Strict networks often allow only :443. With a certificate you can add:
#   tls-listening-port=5349
#   cert=/etc/letsencrypt/live/<host>/fullchain.pem
#   pkey=/etc/letsencrypt/live/<host>/privkey.pem
