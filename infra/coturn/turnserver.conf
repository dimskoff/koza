# ─────────────────────────────────────────────────────────────────────
# koza turn relay (coturn)
#
# turn is the fallback path: when two browsers can't punch a direct
# hole through their NATs, encrypted traffic relays through here.
# only ~10-20% of sessions need it — but without it those users
# simply can't connect.
#
# open these ports on the firewall:
#   3478/udp + 3478/tcp   (stun/turn)
#   49160-49200/udp       (relay range)
# optionally terminate tls on 443 for hostile networks (see below).
# ─────────────────────────────────────────────────────────────────────

listening-port=3478

# long-term credentials mechanism: the signaling server hands out
# time-limited credentials derived from this secret (HMAC).
# set the same value in infra/.env as TURN_SECRET.
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET

realm=koza.example.com

# relay port range
min-port=49160
max-port=49200

# sanity + safety
fingerprint
stale-nonce
total-quota=100        # max concurrent allocations per user
no-multicast-peers     # never relay into LAN ranges
no-cli                 # no admin socket
no-tlsv1
no-tlsv1_1

# log to stdout so docker logs works
log-file=stdout
simple-log

# ── hardening through strict firewalls (optional) ────────────────────
# many mobile / corporate networks only let :443 through. with a cert:
#   listening-port=443        (needs CAP_NET_BIND_SERVICE or root)
#   tls-listening-port=5349
#   cert=/etc/letsencrypt/live/koza.example.com/fullchain.pem
#   pkey=/etc/letsencrypt/live/koza.example.com/privkey.pem
